name: ultrared
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  animate_do: ^3.3.4
  dio: ^5.9.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_cached_pdfview: ^0.4.3
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^18.0.1
  flutter_localization: ^0.3.3
  flutter_riverpod: ^2.6.1
  flutter_slidable: ^3.1.2
  formz: ^0.8.0
  geolocator: ^10.1.0
  go_router: ^6.2.0
  google_fonts: ^4.0.3
  google_maps_flutter: ^2.12.3
  google_maps_webservice: ^0.0.19
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: 0.19.0
  intl_phone_number_input: ^0.7.5
  open_file: ^3.5.10
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  socket_io_client: ^3.0.2
  uuid: ^4.5.1
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/loaders/
    - assets/images/
    - .env
    - assets/fonts/

  fonts:
    - family: 'Roboto'
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Italic-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf # ejemplo de una fuente regular
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf # ejemplo de una fuente bold
